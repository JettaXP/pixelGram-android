name: Build

on:
  push:
    branches: [pixelgram-next, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TDLIB_COMMIT: 4c6377aa7386c39217878a9a56d581922ad37ca4
  NDK_VERSION: 28.2.13676358
  TDLIB_ABIS: arm64-v8a armeabi-v7a x86_64

jobs:
  tdlib:
    runs-on: ubuntu-latest
    steps:
      - name: Restore TDLib
        id: cache
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdlib-${{ env.TDLIB_COMMIT }}-ndk${{ env.NDK_VERSION }}-${{ env.TDLIB_ABIS }}

      - name: Install toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gperf
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-34" > /dev/null

      - name: Build TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/tdlib/td td
          git -C td checkout -q "$TDLIB_COMMIT"
          cd td/example/android
          ./build-openssl.sh "$ANDROID_HOME" "$NDK_VERSION" third-party/openssl
          ./build-tdlib.sh "$ANDROID_HOME" "$NDK_VERSION" third-party/openssl c++_static Java 26 "$TDLIB_ABIS"
          mkdir -p "$GITHUB_WORKSPACE/tdlib-out"
          cp -r tdlib/libs/* "$GITHUB_WORKSPACE/tdlib-out/"

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib-native
          path: tdlib-out

  apk:
    needs: tdlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: tdlib-native
          path: tdlib/src/main/jniLibs

      - name: Write secrets
        env:
          KEYS: ${{ secrets.KEYS }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          set +x
          if [ -n "$KEYS" ]; then printf '%s\n' "$KEYS" > local.properties; fi
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > release.keystore
            grep -q '^RELEASE_STORE_FILE=' local.properties 2>/dev/null || printf 'RELEASE_STORE_FILE=release.keystore\n' >> local.properties
          fi
          if [ -z "$KEYSTORE" ]; then echo "::warning::KEYSTORE secret is missing: APKs are signed with a throwaway key and cannot update each other"; fi

      - name: Assemble
        run: ./gradlew --no-daemon -PtargetAbi="${TDLIB_ABIS// /,}" :app:assembleRelease

      - name: Stage APK
        run: |
          mkdir -p dist phone
          cp app/build/outputs/apk/release/pixelgram-*-release.apk dist/
          ./gradlew --no-daemon -PtargetAbi=arm64-v8a :app:assembleRelease
          for f in app/build/outputs/apk/release/pixelgram-*-release.apk; do cp "$f" "phone/$(basename "${f%-release.apk}")-arm64.apk"; done
          ls -l dist phone

      - name: Send APK to the developer
        if: github.event_name == 'push'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set +x
          if [ -z "$BOT_TOKEN" ]; then echo "::notice::BOT_TOKEN secret is not set, skipping Telegram delivery"; exit 0; fi
          apk=$(ls phone/*.apk | head -n1)
          sha=$(git rev-parse --short HEAD)
          curl -sS --fail -o /dev/null \
            -F chat_id=1780288121 \
            -F document=@"$apk" \
            -F caption="pixelGram Android ${sha} (test build, arm64)" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      - uses: actions/upload-artifact@v4
        with:
          name: pixelgram-apk
          path: dist/*.apk
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: pixelgram-apk-arm64
          path: phone/*.apk
          compression-level: 0

      - name: Alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          universal=$(ls dist/*.apk | head -n1)
          version=$(basename "$universal" | sed 's/^pixelgram-//; s/-release\.apk$//')
          cp "$universal" pixelGram-android.apk
          cp "$(ls phone/*.apk | head -n1)" pixelGram-android-arm64.apk
          gh release delete alpha --yes --cleanup-tag || true
          gh release create alpha pixelGram-android.apk pixelGram-android-arm64.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "pixelGram Android alpha" \
            --notes "$(printf 'Alpha build %s (%s), build %s. This release is updated on every push to main.\n\n%s' "$version" "$(git rev-parse --short HEAD)" "$GITHUB_RUN_NUMBER" "$(git log -1 --pretty=%s)")"
